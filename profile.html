<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Roam-N-Rest</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/favicon.ico" >
</head>
<body data-page="profile">
<header class="site-header">
  <nav class="nav">
    <a class="logo" href="login.html"><img src="img/logo.svg" alt="Roam-N-Rest logo" class="logo-img">Roam-N-Rest</a>
    <div class="nav-links">
      <a href="transport.html">Transport</a>
      <a href="hotels.html">Hotels</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <a href="help.html">Help</a>
      <a href="provider.html" id="nav-provider">Become a provider</a>
      <a href="login.html" id="nav-login">Log in</a>
      <a href="register.html" class="btn-nav">Create account</a>
    </div>
  </nav>
</header>
  <main class="page">
    <p class="eyebrow">Account</p>
    <h1>Your profile</h1>
    <p class="lead">Your details from registration.</p>

    <section class="card profile-card" id="profile-card">
      <dl class="details">
        <div><dt>Full name</dt><dd id="p-name">-</dd></div>
        <div><dt>Email</dt><dd id="p-email">-</dd></div>
        <div><dt>Phone</dt><dd id="p-phone">-</dd></div>
        <div><dt>Gender</dt><dd id="p-gender">-</dd></div>
        <div><dt>Date of birth</dt><dd id="p-dob">-</dd></div>
        <div><dt>NID</dt><dd id="p-nid">-</dd></div>
      </dl>
      <p class="notice error" id="profile-msg" style="display:none">You are not logged in. <a href="login.html">Log in</a> to see your profile.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
